name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Version smoke
        run: python -m cleanyourmail_app --version

  package:
    name: Package Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Build CLI sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build" | Out-Null
          & "./scripts/build-cli-sidecar.ps1" *>&1 | Tee-Object -FilePath "build\sidecar-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Contract against the staged sidecar
        shell: pwsh
        env:
          CYM_CLI: resources\cli\cym-cli.exe
        run: |
          python -m pytest "tests/test_installer_contract.py" "tests/test_cli_contract.py" -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build" | Out-Null
          & "./scripts/build-app.ps1" -SkipSidecar -SkipInstaller *>&1 | Tee-Object -FilePath "build\app-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test the frozen GUI launch
        shell: pwsh
        run: |
          $app = "dist\CleanYourMail\CleanYourMail.exe"
          if (-not (Test-Path -LiteralPath $app)) {
            throw "Missing frozen app: $app"
          }
          $smokeRoot = Join-Path $env:RUNNER_TEMP "cym-gui-smoke"
          $smokeAppData = Join-Path $smokeRoot "appdata"
          $smokeLocalAppData = Join-Path $smokeRoot "localappdata"
          New-Item -ItemType Directory -Force -Path $smokeAppData, $smokeLocalAppData | Out-Null
          $previousQt = $env:QT_QPA_PLATFORM
          $previousAppData = $env:APPDATA
          $previousLocalAppData = $env:LOCALAPPDATA
          $process = $null
          try {
            $env:QT_QPA_PLATFORM = "offscreen"
            $env:APPDATA = $smokeAppData
            $env:LOCALAPPDATA = $smokeLocalAppData
            $process = Start-Process -FilePath $app -PassThru
            Start-Sleep -Seconds 6
            if ($process.HasExited) {
              throw "The frozen GUI exited during launch (exit $($process.ExitCode))."
            }
            Stop-Process -Id $process.Id -Force
            Write-Host "Frozen GUI launch smoke passed."
          }
          finally {
            if ($null -ne $process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
            $env:QT_QPA_PLATFORM = $previousQt
            $env:APPDATA = $previousAppData
            $env:LOCALAPPDATA = $previousLocalAppData
          }

      - name: Smoke test the frozen sidecar version
        shell: pwsh
        run: |
          $sidecar = "dist\CleanYourMail\resources\cli\cym-cli.exe"
          if (-not (Test-Path -LiteralPath $sidecar)) {
            throw "Missing frozen sidecar: $sidecar"
          }
          $version = & $sidecar "--version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -ne "CleanYourMail 1.3.0") {
            throw "Unexpected sidecar version: $version"
          }

      - name: Smoke test the frozen app version
        shell: pwsh
        run: |
          $app = "dist\CleanYourMail\CleanYourMail.exe"
          if (-not (Test-Path -LiteralPath $app)) {
            throw "Missing frozen app: $app"
          }
          $stdout = Join-Path $env:RUNNER_TEMP "clean-your-mail-app-version.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "clean-your-mail-app-version.err.txt"
          $process = Start-Process -FilePath $app `
            -ArgumentList "--version" `
            -NoNewWindow `
            -Wait `
            -PassThru `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr
          $version = (Get-Content -LiteralPath $stdout -Raw).Trim()
          if ($process.ExitCode -ne 0 -or $version -ne "CleanYourMail app 0.6.0") {
            $errorText = ""
            if (Test-Path -LiteralPath $stderr) {
              $errorText = (Get-Content -LiteralPath $stderr -Raw).Trim()
            }
            throw "Unexpected app version: '$version' (exit $($process.ExitCode)) $errorText"
          }

      - name: Verify the packaged contract
        shell: pwsh
        env:
          CYM_CLI: dist\CleanYourMail\resources\cli\cym-cli.exe
          CYM_APP_EXE: dist\CleanYourMail\CleanYourMail.exe
        run: |
          python -m pytest "tests/test_installer_contract.py" -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { exit $LASTEXITCODE }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command "iscc.exe" -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path -LiteralPath $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path -LiteralPath $iscc)) {
            $iscc = Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "ISCC.exe was not installed by Chocolatey."
          }
          & $iscc "/Qp" "packaging\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath "dist\CleanYourMail-Setup-0.6.0.exe")) {
            throw "The installer was not created."
          }

      - name: Smoke test the installer
        shell: pwsh
        timeout-minutes: 10
        run: |
          New-Item -ItemType Directory -Force -Path "build" | Out-Null
          $log = Join-Path (Get-Location) "build\installer-smoke.log"
          $err = Join-Path (Get-Location) "build\installer-smoke.err.log"
          $smoke = Start-Process -FilePath "powershell.exe" `
            -ArgumentList @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts\smoke-installer.ps1") `
            -Wait -PassThru `
            -RedirectStandardOutput $log `
            -RedirectStandardError $err
          Get-Content -LiteralPath $log -ErrorAction SilentlyContinue
          Get-Content -LiteralPath $err -ErrorAction SilentlyContinue
          if ($smoke.ExitCode -ne 0) {
            throw "Installer smoke failed with exit code $($smoke.ExitCode)."
          }

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $setup = "dist\CleanYourMail-Setup-0.6.0.exe"
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$setup.sha256" -Value "$hash  CleanYourMail-Setup-0.6.0.exe" -Encoding ascii
          Get-Content -LiteralPath "$setup.sha256"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourMail-Setup-0.6.0
          path: |
            dist/CleanYourMail-Setup-0.6.0.exe
            dist/CleanYourMail-Setup-0.6.0.exe.sha256
            build/*.log
          if-no-files-found: error
